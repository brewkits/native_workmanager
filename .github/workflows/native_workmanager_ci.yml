name: Native WorkManager CI

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main, develop, 'release/*' ]

jobs:
  test_dart:
    name: Dart Linting & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          # MUST be .fvmrc, not a plain .flutter-version text file. subosito/
          # flutter-action's flutter-version-file only parses pubspec.yaml,
          # .fvmrc or .fvm/fvm_config.json — a bare "3.41.9" file (the previous
          # setup) silently failed to parse and fell back to the `channel`
          # default of 'stable', floating to whatever was newest that day.
          # `channel` is explicitly emptied too, since that default is
          # non-empty even when this key is omitted and a non-empty channel
          # wins over flutter-version-file when both resolve. Confirmed
          # 2026-09-10: the plain-text pin said 3.41.9, CI actually ran 3.47.2
          # (then 3.47.3 the next run) and reformatted files differently than
          # local, turning an unrelated PR red. This project already manages
          # Flutter locally via `fvm`, so .fvmrc is also the natural single
          # source of truth for local `fvm use`.
          channel: ''
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test test/unit/

  build_android:
    name: Build Validation (Android)
    runs-on: ubuntu-latest
    needs: test_dart
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          # MUST be .fvmrc, not a plain .flutter-version text file. subosito/
          # flutter-action's flutter-version-file only parses pubspec.yaml,
          # .fvmrc or .fvm/fvm_config.json — a bare "3.41.9" file (the previous
          # setup) silently failed to parse and fell back to the `channel`
          # default of 'stable', floating to whatever was newest that day.
          # `channel` is explicitly emptied too, since that default is
          # non-empty even when this key is omitted and a non-empty channel
          # wins over flutter-version-file when both resolve. Confirmed
          # 2026-09-10: the plain-text pin said 3.41.9, CI actually ran 3.47.2
          # (then 3.47.3 the next run) and reformatted files differently than
          # local, turning an unrelated PR red. This project already manages
          # Flutter locally via `fvm`, so .fvmrc is also the natural single
          # source of truth for local `fvm use`.
          channel: ''
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android (Debug)
        run: |
          cd example
          flutter build apk --debug --no-pub

  build_ios:
    name: Build Validation (iOS)
    runs-on: macos-latest
    needs: test_dart
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          # MUST be .fvmrc, not a plain .flutter-version text file. subosito/
          # flutter-action's flutter-version-file only parses pubspec.yaml,
          # .fvmrc or .fvm/fvm_config.json — a bare "3.41.9" file (the previous
          # setup) silently failed to parse and fell back to the `channel`
          # default of 'stable', floating to whatever was newest that day.
          # `channel` is explicitly emptied too, since that default is
          # non-empty even when this key is omitted and a non-empty channel
          # wins over flutter-version-file when both resolve. Confirmed
          # 2026-09-10: the plain-text pin said 3.41.9, CI actually ran 3.47.2
          # (then 3.47.3 the next run) and reformatted files differently than
          # local, turning an unrelated PR red. This project already manages
          # Flutter locally via `fvm`, so .fvmrc is also the natural single
          # source of truth for local `fvm use`.
          channel: ''
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The plugin ships BOTH CocoaPods and SwiftPM. This job validates that it
      # compiles; the SwiftPM *artifact* is validated separately below, because
      # Package.swift's binaryTarget points at a GitHub release asset that does not
      # exist until the release is cut. Resolving it on a release PR can only 404,
      # and a check that is red by construction is one people learn to ignore.
      - name: Build iOS via CocoaPods (Debug/No-Codesign)
        run: |
          flutter config --no-enable-swift-package-manager
          cd example
          flutter build ios --no-codesign --debug --no-pub

      # The SwiftPM consumer path. Split out from the build above because
      # Package.swift's binaryTarget points at a GitHub release asset that does not
      # exist until the release is cut, so resolving it on a release PR can only
      # 404 — and a check that is red by construction is one people learn to
      # ignore. The script checks everything that CAN be checked pre-publication
      # (manifest shape, hyphenated product, remote binaryTarget, no testTarget,
      # both xcframework slices) and verifies the published checksum once the
      # asset is live. Runnable locally before tagging: ./scripts/verify_spm_release.sh
      - name: Verify SwiftPM release readiness
        env:
          # A missing asset is expected on a release PR, but never on main or on a
          # tag — there it means SwiftPM consumers cannot resolve the release.
          REQUIRE_PUBLISHED_ASSET: ${{ (github.ref_name == 'main' || github.ref_type == 'tag') && '1' || '0' }}
        run: ./scripts/verify_spm_release.sh
