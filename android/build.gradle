group = "dev.brewkits.native_workmanager"
version = "1.3.0"

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

repositories {
    google()
    mavenCentral()
}

android {
    namespace = "dev.brewkits.native_workmanager"

    // Must be >= 36: kmpworkmanager 3.3.0 dropped koin-android and began declaring
    // androidx.core directly, which resolves androidx.core:core-ktx to 1.17.0 — and
    // that artifact's AAR metadata requires consumers to compile against API 36+.
    // Staying on 35 fails :native_workmanager:checkDebugAarMetadata outright.
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 26  // Android 8.0+ required for WorkManager
        consumerProguardFiles 'proguard-rules.pro'
    }

    dependencies {
        // KMP WorkManager - Core library (from Maven Central v3.0.1)
        // v3.0.1 fixes expedited-task crash on Android 8-11 (missing getForegroundInfo,
        // regressed v2.3.8..v3.0.0). Ktor HTTP workers moved to kmpworkmanager-http in
        // v3.0.0 — NOT needed here (plugin ships its own native workers).
        // v3.1.0 enforces Constraints.maxRetries in BaseKmpWorker.doWorkInternal: reads the
        // "maxRetries" key (NativeTaskScheduler.KEY_MAX_RETRIES) off WorkRequest Data and caps
        // Failure(shouldRetry=true)/Retry at N+1 total runs. Direct-enqueue paths in this plugin
        // must stamp that key themselves (see enqueueOneTimeWorkDirect / ChainHelper / GraphHelper).
        // v3.2.0 (Fixes upstream #64): removed the FOREGROUND_SERVICE / FOREGROUND_SERVICE_DATA_SYNC
        // permissions and the SystemForegroundService <service> merge from kmpworkmanager's OWN
        // internal manifest — those were unconditionally merged into every consumer app regardless
        // of whether it used KmpHeavyWorker, causing Play Store rejections for apps that never
        // touched foreground services. This plugin declares the SAME two permissions in its own
        // android/src/main/AndroidManifest.xml (unconditionally, independently of kmpworkmanager) —
        // see that file's comments for the matching fix here. iOS sources are unaffected by 3.2.0's
        // FGS fix. Bumped again 3.2.0 -> 3.3.1 for v1.5.0: that span covers TWO upstream
        // releases — 3.3.0 (BREAKING: Koin dropped; iOS execution history no longer silently
        // dropped) and 3.3.1 (iOS single-task persistence, monotonic durations, KSP duplicate-
        // worker-key build failure, iOS filename path-traversal fix). See CHANGELOG 1.5.0.
        // Bumped 3.3.1 -> 3.4.1 for v1.6.0. Two upstream releases; the parts that reach this
        // plugin without any Dart-side change:
        //   * 3.4.0 FIXED TaskTrigger.Exact — the default AlarmReceiver registered by
        //     KmpWorkManager.initialize() logged the fired alarm and never ran the worker, so
        //     EVERY exact-alarm task fired on time and did nothing. This plugin uses that default
        //     receiver (it subclasses neither AlarmReceiver nor BaseAlarmReceiver), so exact
        //     triggers start actually executing on this bump.
        //   * 3.4.0 CHANGED setExpedited() to be gated on TaskPriority. Standalone enqueue() has
        //     no priority parameter, so plugin tasks are NORMAL and are no longer blanket-expedited
        //     — expect slightly later scheduling under WorkManager quota pressure.
        //   * 3.4.0/3.4.1 also fix Android exact-alarm metadata loss on process kill, an
        //     overflow-file leak on REPLACE reschedule, chain-step overflow leaks on cancel,
        //     KmpHeavyWorker treating a transient FGS denial as permanent failure, and
        //     ExecutionRecord.errorMessage always persisting as null in getExecutionHistory().
        // The BREAKING part of 3.4.0 (AlarmReceiver.onReceive no longer removes AlarmStore
        // metadata before dispatch) only affects apps that subclass AlarmReceiver DIRECTLY —
        // this plugin does not, so no migration is needed here. enqueue() gained defaulted
        // `tags`/`deadlineMs` parameters; Kotlin defaults keep this source-compatible, but the
        // ObjC-exported selector changed on iOS — see KMPSchedulerBridge.swift.
        api("dev.brewkits:kmpworkmanager:3.4.1")

        // androidx.startup — auto-initializes the plugin before Application.onCreate()
        // so DartWorker works out-of-the-box without a custom Application class.
        implementation("androidx.startup:startup-runtime:1.1.1")
        // Android WorkManager. 2.11.2 (was 2.10.1) fixes an upstream work-runtime bug where a
        // background WorkRequest could run before connectivity state was fully attached,
        // causing intermittent "Failed host lookup" SocketExceptions on Android 15/16
        // (https://issuetracker.google.com/issues/445324855). kmpworkmanager pulls in
        // work-runtime-ktx 2.9.1 transitively; this `api` declaration is the higher request and
        // wins Gradle's default highest-version resolution.
        api("androidx.work:work-runtime-ktx:2.11.2")

        // JSON serialization (required for WorkerResult.Success.data: JsonObject?)
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")

        // Coroutines for async operations
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")

        // HTTP Client for native workers
        implementation("com.squareup.okhttp3:okhttp:4.12.0")

        // ExifInterface for image orientation handling
        implementation("androidx.exifinterface:exifinterface:1.3.7")

        // Security crypto for encrypted shared preferences
        implementation("androidx.security:security-crypto:1.1.0")

        // Testing
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.0.0")
        testImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")
        testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0")
        // Real org.json on the unit-test classpath. With `returnDefaultValues = true`,
        // android.jar's stubbed org.json returns null from JSONObject.toString(), which
        // NPEs any worker/reporter that builds JSON in a plain (non-Robolectric) host
        // test (e.g. ProgressReporterTest). The real implementation shadows the stub.
        testImplementation("org.json:json:20240303")
        // Robolectric + androidx.test for tests that need an Android runtime
        // (NativeWorkManagerInitializerTest). Without these the unit-test source
        // set fails to compile (unresolved RobolectricTestRunner / ApplicationProvider).
        testImplementation("org.robolectric:robolectric:4.12.2")
        testImplementation("androidx.test:core:1.5.0")
    }

    testOptions {
        unitTests {
            // Return default values for unmocked Android methods instead of throwing exceptions
            returnDefaultValues = true
            // Required by Robolectric (NativeWorkManagerInitializerTest)
            includeAndroidResources = true

            all {
                testLogging {
                   events "passed", "skipped", "failed", "standardOut", "standardError"
                   outputs.upToDateWhen {false}
                   showStandardStreams = true
                }
            }
        }
    }
}
