# Pin the Robolectric runtime SDK. Under AGP 9 (issue #76) a library's unit tests inherit
# targetSdk = compileSdk (36), and Robolectric 4.12.2 tops out at 34, so every Robolectric test
# class failed with "targetSdkVersion=36 > maxSdkVersion=34". SDK 35+ android-all jars would also
# need JDK 21 while CI runs JDK 17. 34 is what these tests ran against before the migration.
sdk=34
